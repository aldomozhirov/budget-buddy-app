<!doctype html>
<!--
  Source of the app icon (spec 01, decision O4): "BB" in Geist 700, `on-ink`
  on an `ink` square. The colours are the light-theme tokens of
  src/styles/bb.css. The square is full-bleed and the mark stays inside the
  central 60%, so iOS and Android can round or mask the corners themselves.
  `pnpm icons` renders this file to web/public/ (scripts/build-icons.mjs).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        font-weight: 700;
        src: url(../src/styles/fonts/Geist-700.woff2) format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 512px;
        height: 512px;
        background: #15171a;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f4f3ef;
        font:
          700 224px/1 'Geist',
          sans-serif;
        letter-spacing: -0.05em;
        /* The negative spacing shifts the pair left; this puts it back. */
        padding-left: 0.05em;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    BB
  </body>
</html>
