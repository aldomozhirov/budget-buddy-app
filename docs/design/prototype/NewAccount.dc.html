<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budget Buddy — New account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.bb-light{--bg:#F4F3EF;--surface:#FFFFFF;--ink:#15171A;--on-ink:#F4F3EF;--muted:#5C6168;--line:#E2E0D9;--soft:#EAE8E2;--accent:#1D5C45;--accent-soft:#DCEAE3;--warn:#A2470F;--warn-soft:#F5E2D4;--scrim:rgba(20,20,18,.36)}
.bb-dark{--bg:#111214;--surface:#1A1C1F;--ink:#F1F0EC;--on-ink:#111214;--muted:#A3A8AF;--line:#2B2E33;--soft:#24272B;--accent:#7CC6A3;--accent-soft:#1D3229;--warn:#F2A574;--warn-soft:#3A2618;--scrim:rgba(0,0,0,.55)}
.bb button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.bb .num{font-variant-numeric:tabular-nums}
.bb svg{flex:none}
.bb .scroll::-webkit-scrollbar{display:none}
.bb .lbl{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.bb .text{width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px;padding:0 14px;outline:none}
.bb .text:focus{border-color:var(--ink)}
.bb .text::placeholder{color:var(--muted)}
.bb .seg{flex:1;height:40px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);text-align:center}
.bb .seg-on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bb .tile{min-height:52px;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;text-align:left}
.bb .tile-on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.bb .chip{flex:none;height:44px;padding:0 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:500;display:flex;align-items:center;white-space:nowrap}
.bb .chip-on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.bb .chip-ghost{background:transparent;color:var(--muted);border-style:dashed}
.bb .key{height:46px;border-radius:12px;background:var(--surface);font-size:21px;font-weight:500;display:flex;align-items:center;justify-content:center}
.bb .key-op{background:var(--soft);font-size:19px}
.bb .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* motion */
@keyframes bb-in-fwd{from{transform:translateX(100%)}to{transform:none}}
@keyframes bb-in-back{from{transform:translateX(-28%);opacity:.6}to{transform:none;opacity:1}}
@keyframes bb-fade{from{opacity:0}to{opacity:1}}
@keyframes bb-sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes bb-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bb-growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bb-draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@keyframes bb-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bb-shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bb-down{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.bb.nav-fwd{animation:bb-in-fwd .42s cubic-bezier(.32,.72,0,1) both;box-shadow:-12px 0 32px rgba(0,0,0,.12)}
.bb.nav-back{animation:bb-in-back .38s cubic-bezier(.32,.72,0,1) both}
.bb [role="dialog"]{animation:bb-sheet .42s cubic-bezier(.32,.72,0,1) both;will-change:transform}
.bb div[style*="var(--scrim)"],.bb div[style*="rgba(20,20,18,.36)"],.bb div[style*="rgba(20, 20, 18, 0.36)"]{animation:bb-fade .3s ease-out both}
.bb div[style*="inset: 0"][style*="background: var(--bg)"]{animation:bb-sheet .42s cubic-bezier(.32,.72,0,1) both}
.bb span[style*="width: 72px; height: 72px"],.bb span[style*="width: 56px; height: 56px; border-radius: 28px; background: var(--accent-soft)"]{animation:bb-pop .4s cubic-bezier(.2,.8,.2,1) .25s both}
.bb [style*="height: 6px"]>[style*="height: 6px"],.bb [style*="height: 4px"]>[style*="height: 4px"]{transform-origin:left center;animation:bb-grow .8s cubic-bezier(.2,.8,.2,1) .3s both;transition:width .45s cubic-bezier(.2,.8,.2,1),background-color .3s}
.bb div[title][style*="border-radius: 6px 6px 0 0"]{transform-origin:bottom;animation:bb-growy .7s cubic-bezier(.2,.8,.2,1) .3s both}
.bb polyline{stroke-dasharray:1400;animation:bb-draw 1.1s cubic-bezier(.4,0,.2,1) .3s both}
.bb button,.bb a{transition:transform .12s ease,background-color .18s ease,color .18s ease,border-color .18s ease,opacity .18s ease}
.bb button:active:not([disabled]),.bb a:active{transform:scale(.97)}
.bb .key:active{transform:scale(.92)}
.bb .knob{transition:left .22s cubic-bezier(.3,.7,.3,1)}
.bb .switch{transition:background-color .22s}
.bb span[style*="width: 27px; height: 27px"]{transition:left .22s cubic-bezier(.3,.7,.3,1)}
.bb span[style*="width: 51px; height: 31px"]{transition:background-color .22s}
.bb .pw-err{animation:bb-shake .4s ease}
.bb [role="alert"]:not(:empty),.bb [role="status"]{animation:bb-fade .3s ease-out both}
.bb .wrap{animation:bb-down .22s ease-out both}
@media (prefers-reduced-motion: reduce){.bb,.bb *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="bb {{themeClass}}" onClickCapture="{{navCapture}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column">

<div style="padding: 48px 16px 8px; display: flex; align-items: center; gap: 12px">
<a href="Accounts.dc.html" aria-label="Cancel" style="width: 44px; height: 44px; border-radius: 22px; background: var(--surface); display: flex; align-items: center; justify-content: center; flex: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">New account</h1>
</div>

<div class="scroll" style="flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="acc-name" class="lbl">Name</label>
<input id="acc-name" class="text" type="text" autocomplete="off" placeholder="{{namePlaceholder}}" value="{{name}}" onChange="{{onName}}" onFocus="{{hideKeypad}}">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span class="lbl">Owner</span>
<div role="radiogroup" aria-label="Owner" style="display: flex; gap: 2px; padding: 3px; border-radius: 13px; background: var(--soft)">
<sc-for list="{{owners}}" as="o" hint-placeholder-count="3">
<button role="radio" aria-checked="{{o.on}}" class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span class="lbl">Type</span>
<div role="radiogroup" aria-label="Type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="6">
<button role="radio" aria-checked="{{t.on}}" class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span class="lbl">Currency or coin</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{curs}}" as="c" hint-placeholder-count="4">
<button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button>
</sc-for>
<button class="chip chip-ghost" aria-label="Other currency or coin">Other…</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span class="lbl">{{amountLabel}}</span>
<button onClick="{{showKeypad}}" aria-label="{{amountLabel}}" style="height: 64px; border-radius: 14px; background: var(--surface); border: {{amountBorder}}; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; text-align: left">
<span class="num" style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: {{amountColor}}">{{amountText}}</span>
<span style="font-size: 13px; color: var(--muted)">Today ▾</span>
</button>
<span class="num" style="font-size: 13px; color: var(--muted)">{{amountHint}}</span>
</div>
</div>

<sc-if value="{{keypad}}" hint-placeholder-val="{{ false }}">
<div style="padding: 10px 16px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{keys}}" as="key" hint-placeholder-count="20">
<button class="{{key.cls}}" aria-label="{{key.aria}}" onClick="{{key.press}}">{{key.label}}</button>
</sc-for>
</div>
</sc-if>

<div style="padding: 10px 16px 30px">
<button onClick="{{create}}" disabled="{{createDisabled}}" style="width: 100%; height: 56px; border-radius: 18px; background: {{createBg}}; color: {{createFg}}; font-weight: 600; font-size: 17px; text-align: center">{{createLabel}}</button>
</div>

<sc-if value="{{created}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; box-sizing: border-box; text-align: center">
<span style="width: 72px; height: 72px; border-radius: 36px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
<h2 style="margin: 0; font-size: 22px; font-weight: 600">{{createdTitle}}</h2>
<p class="num" style="margin: 0; color: var(--muted)">{{createdSub}}</p>
<div style="display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 16px">
<a href="AccountDetail.dc.html" style="height: 56px; border-radius: 18px; background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 17px">Open account</a>
<a href="Accounts.dc.html" style="height: 56px; border-radius: 18px; background: var(--surface); display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 17px">Back to accounts</a>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: '', owner: 'Alena', type: 'Bank', cur: 'EUR', expr: '', keypad: false, created: false };
  }
  evaluate(s) {
    var t = s.replace(/−/g, '-').replace(/×/g, '*').replace(/÷/g, '/');
    var i = 0;
    function peek() { return t[i]; }
    function num() {
      var st = i;
      while (i < t.length && /[0-9.]/.test(t[i])) i++;
      var str = t.slice(st, i);
      if (!str || !/^(\d+\.?\d*|\.\d+)$/.test(str)) throw new Error('num');
      return parseFloat(str);
    }
    function factor() {
      if (peek() === '-') { i++; return -factor(); }
      if (peek() === '+') { i++; return factor(); }
      var v;
      if (peek() === '(') { i++; v = expr(); if (peek() !== ')') throw new Error('paren'); i++; }
      else v = num();
      while (peek() === '%') { i++; v = v / 100; }
      return v;
    }
    function term() {
      var v = factor();
      while (peek() === '*' || peek() === '/') {
        var op = t[i++]; var r = factor();
        if (op === '/') { if (r === 0) throw new Error('div0'); v = v / r; } else v = v * r;
      }
      return v;
    }
    function expr() {
      var v = term();
      while (peek() === '+' || peek() === '-') {
        var op = t[i++]; var r = term();
        v = op === '+' ? v + r : v - r;
      }
      return v;
    }
    var v = expr();
    if (i !== t.length) throw new Error('trailing');
    return v;
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var CUR = { EUR: { sym: '€', dec: 2 }, USD: { sym: '$', dec: 2 }, RUB: { sym: '₽', dec: 2 }, BTC: { sym: '₿', dec: 8 } };
    var c = CUR[st.cur];
    function money(v) { return (v < 0 ? '−' : '') + c.sym + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: c.dec, maximumFractionDigits: c.dec }); }
    var owe = st.type === 'We owe';
    var value = null;
    try { if (st.expr) { var f = Math.pow(10, c.dec); value = Math.round(this.evaluate(st.expr) * f) / f; } } catch (e) { value = null; }
    var stored = value === null ? null : (owe ? -Math.abs(value) : value);

    var owners = ['Alena', 'Max', 'Sofia'].map(function (o) {
      var on = st.owner === o;
      return { label: o === 'Alena' ? 'You' : o, on: on, cls: on ? 'seg seg-on' : 'seg', pick: function () { self.setState({ owner: o }); } };
    });
    var types = [['Bank', 'Bank'], ['Cash', 'Cash'], ['Investment', 'Investment'], ['Crypto', 'Crypto'], ['We owe', 'Money we owe'], ['Owed to us', 'Money owed to us']].map(function (t) {
      var on = st.type === t[0];
      return { label: t[1], on: on, cls: on ? 'tile tile-on' : 'tile', pick: function () {
        var patch = { type: t[0] };
        if (t[0] === 'Crypto' && st.cur !== 'BTC') patch.cur = 'BTC';
        if (t[0] !== 'Crypto' && st.cur === 'BTC') patch.cur = 'EUR';
        self.setState(patch);
      } };
    });
    var curs = ['EUR', 'USD', 'RUB', 'BTC'].map(function (k) {
      var on = st.cur === k;
      return { label: k, on: on, cls: on ? 'chip chip-on' : 'chip', pick: function () { self.setState({ cur: k }); } };
    });
    function press(k) {
      return function () {
        var e = self.state.expr;
        if (k === 'C') e = '';
        else if (k === '⌫') e = e.slice(0, -1);
        else e = (e + k).slice(0, 40);
        self.setState({ expr: e });
      };
    }
    var KEYS = ['7', '8', '9', '(', ')', '4', '5', '6', '×', '÷', '1', '2', '3', '+', '−', '.', '0', '%', '⌫', 'C'];
    var ARIA = { '(': 'Open bracket', ')': 'Close bracket', '×': 'Multiply', '÷': 'Divide', '+': 'Plus', '−': 'Minus', '%': 'Percent', '⌫': 'Delete', 'C': 'Clear', '.': 'Decimal point' };
    var keys = KEYS.map(function (k) {
      var op = !/[0-9.]/.test(k);
      return { label: k, aria: ARIA[k] || k, cls: op ? 'key key-op' : 'key', press: press(k) };
    });
    var hint;
    if (owe) hint = value === null ? 'Type what you owe as a positive number. It’s stored as a negative balance.' : 'Stored as ' + money(stored) + ', a negative balance.';
    else if (st.expr && value === null) hint = 'Can’t calculate that yet.';
    else hint = 'Optional. Becomes the first balance in its history.';
    var nameOk = st.name.trim().length > 0;
    var PH = { Bank: 'e.g. ING Girokonto', Cash: 'e.g. Cash in wallet', Investment: 'e.g. Trade Republic', Crypto: 'e.g. Bitcoin, Trust Wallet', 'We owe': 'e.g. Car loan', 'Owed to us': 'e.g. Loan to a friend' };
    return {
      themeClass: (this.props.dark ? 'bb-dark' : 'bb-light') + ' ' + (function () { try { return sessionStorage.getItem('bb-nav') === 'back' ? 'nav-back' : 'nav-fwd'; } catch (e) { return 'nav-fwd'; } })(),
      navCapture: function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a) return;
        var href = a.getAttribute('href') || '', label = (a.getAttribute('aria-label') || '') + ' ' + (a.textContent || '');
        var back = href === 'Main.dc.html' || /^\s*(Back|Close|Cancel|Done|Later|Keep)/.test(label) || /^\s*(Back home|Back to)/.test(a.textContent || '');
        try { sessionStorage.setItem('bb-nav', back ? 'back' : 'fwd'); if (!back) sessionStorage.setItem('bb-from:' + href, 'NewAccount.dc.html'); } catch (err) {}
      },
      name: st.name,
      namePlaceholder: PH[st.type],
      onName: function (e) { self.setState({ name: e.target.value }); },
      hideKeypad: function () { self.setState({ keypad: false }); },
      owners: owners, types: types, curs: curs, keys: keys,
      keypad: st.keypad,
      showKeypad: function () { self.setState({ keypad: true }); },
      amountLabel: owe ? 'Amount owed' : 'Opening balance',
      amountBorder: st.keypad ? '1.5px solid var(--ink)' : '1px solid var(--line)',
      amountText: value === null ? c.sym + '0' : money(owe ? Math.abs(value) : value),
      amountColor: value === null ? 'var(--muted)' : 'var(--ink)',
      amountHint: hint,
      createDisabled: !nameOk,
      createBg: nameOk ? 'var(--ink)' : 'var(--soft)',
      createFg: nameOk ? 'var(--on-ink)' : 'var(--muted)',
      createLabel: nameOk ? 'Create account' : 'Name the account',
      create: function () { if (nameOk) self.setState({ created: true, keypad: false }); },
      created: st.created,
      createdTitle: st.name.trim() + ' · ' + st.cur,
      createdSub: (st.owner === 'Alena' ? 'Yours' : st.owner + '’s') + ' · ' + (stored === null ? 'no opening balance yet' : 'opening balance ' + money(stored)) + '. It joins the next check-in.'
    };
  }
}
</script>
</body>
</html>
