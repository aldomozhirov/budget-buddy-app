<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budget Buddy — Home · offline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.bb-light{--bg:#F4F3EF;--surface:#FFFFFF;--ink:#15171A;--on-ink:#F4F3EF;--muted:#5C6168;--line:#E2E0D9;--soft:#EAE8E2;--accent:#1D5C45;--accent-soft:#DCEAE3;--warn:#A2470F;--warn-soft:#F5E2D4;--scrim:rgba(20,20,18,.36)}
.bb-dark{--bg:#111214;--surface:#1A1C1F;--ink:#F1F0EC;--on-ink:#111214;--muted:#A3A8AF;--line:#2B2E33;--soft:#24272B;--accent:#7CC6A3;--accent-soft:#1D3229;--warn:#F2A574;--warn-soft:#3A2618;--scrim:rgba(0,0,0,.55)}
.bb button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.bb .num{font-variant-numeric:tabular-nums}
.bb svg{flex:none}
.bb .scroll::-webkit-scrollbar{display:none}
.bb .seg{flex:1;height:36px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);text-align:center}
.bb .seg-on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bb .chip{flex:none;height:44px;padding:0 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:500;display:flex;align-items:center;white-space:nowrap}
.bb .chip-on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.bb .key{height:46px;border-radius:12px;background:var(--bg);font-size:21px;font-weight:500;display:flex;align-items:center;justify-content:center}
.bb .key-op{background:var(--soft);font-size:19px}
.bb .note{width:100%;box-sizing:border-box;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 12px;outline:none}
.bb .note::placeholder{color:var(--muted)}
.bb .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* motion */
@keyframes bb-in-fwd{from{transform:translateX(100%)}to{transform:none}}
@keyframes bb-in-back{from{transform:translateX(-28%);opacity:.6}to{transform:none;opacity:1}}
@keyframes bb-fade{from{opacity:0}to{opacity:1}}
@keyframes bb-sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes bb-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bb-growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bb-draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@keyframes bb-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bb-shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bb-down{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.bb.nav-fwd{animation:bb-in-fwd .42s cubic-bezier(.32,.72,0,1) both;box-shadow:-12px 0 32px rgba(0,0,0,.12)}
.bb.nav-back{animation:bb-in-back .38s cubic-bezier(.32,.72,0,1) both}
.bb [role="dialog"]{animation:bb-sheet .42s cubic-bezier(.32,.72,0,1) both;will-change:transform}
.bb div[style*="var(--scrim)"],.bb div[style*="rgba(20,20,18,.36)"],.bb div[style*="rgba(20, 20, 18, 0.36)"]{animation:bb-fade .3s ease-out both}
.bb div[style*="inset: 0"][style*="background: var(--bg)"]{animation:bb-sheet .42s cubic-bezier(.32,.72,0,1) both}
.bb span[style*="width: 72px; height: 72px"],.bb span[style*="width: 56px; height: 56px; border-radius: 28px; background: var(--accent-soft)"]{animation:bb-pop .4s cubic-bezier(.2,.8,.2,1) .25s both}
.bb [style*="height: 6px"]>[style*="height: 6px"],.bb [style*="height: 4px"]>[style*="height: 4px"]{transform-origin:left center;animation:bb-grow .8s cubic-bezier(.2,.8,.2,1) .3s both;transition:width .45s cubic-bezier(.2,.8,.2,1),background-color .3s}
.bb div[title][style*="border-radius: 6px 6px 0 0"]{transform-origin:bottom;animation:bb-growy .7s cubic-bezier(.2,.8,.2,1) .3s both}
.bb polyline{stroke-dasharray:1400;animation:bb-draw 1.1s cubic-bezier(.4,0,.2,1) .3s both}
.bb button,.bb a{transition:transform .12s ease,background-color .18s ease,color .18s ease,border-color .18s ease,opacity .18s ease}
.bb button:active:not([disabled]),.bb a:active{transform:scale(.97)}
.bb .key:active{transform:scale(.92)}
.bb .knob{transition:left .22s cubic-bezier(.3,.7,.3,1)}
.bb .switch{transition:background-color .22s}
.bb span[style*="width: 27px; height: 27px"]{transition:left .22s cubic-bezier(.3,.7,.3,1)}
.bb span[style*="width: 51px; height: 31px"]{transition:background-color .22s}
.bb .pw-err{animation:bb-shake .4s ease}
.bb [role="alert"]:not(:empty),.bb [role="status"]{animation:bb-fade .3s ease-out both}
.bb .wrap{animation:bb-down .22s ease-out both}
.bb .lbl{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.bb .hrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.bb .hrow::-webkit-scrollbar{display:none}
.bb .chip-ghost{background:transparent;color:var(--muted);border-style:dashed}
.bb .input{width:100%;box-sizing:border-box;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 12px;outline:none}
.bb .input:focus{border-color:var(--ink)}
.bb .opt{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);text-align:left;text-decoration:none}
.bb .card{display:flex;flex-direction:column;border-radius:20px;background:var(--surface)}

@media (prefers-reduced-motion: reduce){.bb,.bb *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="bb {{themeClass}}" onClickCapture="{{navCapture}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column">
<div class="scroll" style="flex: 1; overflow-y: auto; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: var(--muted)">Monday, 5 October</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Hi, Alena</h1>
</div>
<span style="height: 32px; padding: 0 12px; border-radius: 16px; background: var(--warn-soft); color: var(--warn); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M9 19h8a4 4 0 0 0 1.6-7.7"></path><path d="M6 9.6A5 5 0 0 0 7 19"></path></svg>Offline</span>
</header>

<nav aria-label="Quick actions" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="AddExpense.dc.html" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface); text-decoration: none; min-height: 44px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>
<span style="font-weight: 500">Income</span>
</a>
<a href="AddTransferFx.dc.html" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface); text-decoration: none; min-height: 44px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h15l-3-3"></path><path d="M20 16H5l3 3"></path></svg>
<span style="font-weight: 500">Transfer</span>
</a>
</nav>

<sc-if value="{{hasWaiting}}" hint-placeholder-val="{{ true }}">
<section aria-labelledby="wait-h" class="card" style="padding: 16px 16px 6px; gap: 2px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13v8"></path><path d="M8 17l4-4 4 4"></path><path d="M20 16.6A4.5 4.5 0 0 0 17.5 8h-1.3A7 7 0 1 0 4 14.9"></path></svg>
<h2 id="wait-h" style="flex: 1; margin: 0; font-size: 15px; font-weight: 600">Waiting to send · {{waitCount}}</h2>
</div>
<span style="font-size: 13px; color: var(--muted); padding: 2px 0 6px 30px">They send themselves when you’re back online.</span>
<sc-for list="{{waiting}}" as="w" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-top: 1px solid var(--line)">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 500">{{w.title}}</span>
<span style="font-size: 13px; color: var(--muted)">{{w.meta}}</span>
</span>
<span style="font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: var(--soft); color: var(--muted)">On this phone</span>
</div>
</sc-for>
</section>
</sc-if>

<div style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 16px; background: var(--soft)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 1px"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>
<span style="flex: 1; font-size: 14px">{{infoText}}</span>
</div>

</div>

<div style="padding: 12px 16px 34px; background: var(--bg); border-top: 1px solid var(--line)">
<a href="AddExpense.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; border-radius: 18px; background: var(--ink); color: var(--on-ink); text-decoration: none; font-size: 17px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Add expense
</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"locked":{"editor":"boolean","default":false},"waiting":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  nav(from) {
    return {
      themeClass: (this.props.dark ? 'bb-dark' : 'bb-light') + ' ' + (function () { try { return sessionStorage.getItem('bb-nav') === 'back' ? 'nav-back' : 'nav-fwd'; } catch (e) { return 'nav-fwd'; } })(),
      navCapture: function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a) return;
        var href = a.getAttribute('href') || '', label = (a.getAttribute('aria-label') || '') + ' ' + (a.textContent || '');
        var back = href === 'Main.dc.html' || /^\s*(Back|Close|Cancel|Done|Later|Keep)/.test(label) || /^\s*(Back home|Back to)/.test(a.textContent || '');
        try { sessionStorage.setItem('bb-nav', back ? 'back' : 'fwd'); if (!back && from) sessionStorage.setItem('bb-from:' + href, from); } catch (err) {}
      }
    };
  }
  evaluate(s) {
    var t = s.replace(/−/g, '-').replace(/×/g, '*').replace(/÷/g, '/');
    var i = 0;
    function peek() { return t[i]; }
    function num() {
      var st = i;
      while (i < t.length && /[0-9.]/.test(t[i])) i++;
      var str = t.slice(st, i);
      if (!str || !/^(\d+\.?\d*|\.\d+)$/.test(str)) throw new Error('num');
      return parseFloat(str);
    }
    function factor() {
      if (peek() === '-') { i++; return -factor(); }
      if (peek() === '+') { i++; return factor(); }
      var v;
      if (peek() === '(') { i++; v = expr(); if (peek() !== ')') throw new Error('paren'); i++; }
      else v = num();
      while (peek() === '%') { i++; v = v / 100; }
      return v;
    }
    function term() {
      var v = factor();
      while (peek() === '*' || peek() === '/') {
        var op = t[i++]; var r = factor();
        if (op === '/') { if (r === 0) throw new Error('div0'); v = v / r; } else v = v * r;
      }
      return v;
    }
    function expr() {
      var v = term();
      while (peek() === '+' || peek() === '-') {
        var op = t[i++]; var r = term();
        v = op === '+' ? v + r : v - r;
      }
      return v;
    }
    var v = expr();
    if (i !== t.length) throw new Error('trailing');
    return Math.round(v * 100) / 100;
  }
  tryEval(s) { try { return s ? this.evaluate(s) : null; } catch (e) { return null; } }
  keypad(onKey) {
    var KEYS = ['7', '8', '9', '(', ')', '4', '5', '6', '×', '÷', '1', '2', '3', '+', '−', '.', '0', '%', '⌫', 'C'];
    var ARIA = { '(': 'Open bracket', ')': 'Close bracket', '×': 'Multiply', '÷': 'Divide', '+': 'Plus', '−': 'Minus', '%': 'Percent', '⌫': 'Delete', 'C': 'Clear', '.': 'Decimal point' };
    return KEYS.map(function (k) {
      return { label: k, aria: ARIA[k] || k, cls: /[0-9.]/.test(k) ? 'key' : 'key key-op', press: function () { onKey(k); } };
    });
  }
  typed(e, k) {
    if (k === 'C') return '';
    if (k === '⌫') return e.slice(0, -1);
    return (e + k).slice(0, 40);
  }

  renderVals() {
    var locked = !!this.props.locked;
    var showWaiting = this.props.waiting ?? true;
    // listed by merchant, else category; never with amounts (D3)
    var W = showWaiting ? [
      { title: 'REWE', meta: 'Expense · today, 12:04' },
      { title: 'Eating out', meta: 'Expense · today, 13:30' }
    ] : [];
    return Object.assign(this.nav('Main.dc.html'), {
      hasWaiting: W.length > 0,
      waitCount: W.length,
      waiting: W,
      infoText: locked ? 'Balances, envelopes and check-ins show when you’re back online and signed in.' : 'Balances, envelopes and check-ins show when you’re back online.'
    });
  }
}
</script>
</body>
</html>
