<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budget Buddy — Accounts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.bb-light{--bg:#F4F3EF;--surface:#FFFFFF;--ink:#15171A;--on-ink:#F4F3EF;--muted:#5C6168;--line:#E2E0D9;--soft:#EAE8E2;--accent:#1D5C45;--accent-soft:#DCEAE3;--warn:#A2470F;--warn-soft:#F5E2D4;--scrim:rgba(20,20,18,.36)}
.bb-dark{--bg:#111214;--surface:#1A1C1F;--ink:#F1F0EC;--on-ink:#111214;--muted:#A3A8AF;--line:#2B2E33;--soft:#24272B;--accent:#7CC6A3;--accent-soft:#1D3229;--warn:#F2A574;--warn-soft:#3A2618;--scrim:rgba(0,0,0,.55)}
.bb button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.bb .num{font-variant-numeric:tabular-nums}
.bb svg{flex:none}
.bb .scroll::-webkit-scrollbar{display:none}
.bb .seg{flex:1;height:36px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);text-align:center}
.bb .seg-on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bb .hrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.bb .hrow::-webkit-scrollbar{display:none}
.bb .fchip{flex:none;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;display:flex;align-items:center;gap:4px;white-space:nowrap}
.bb .fchip-on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.bb .opt{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;padding:4px 0;border-bottom:1px solid var(--line);text-align:left}
.bb .box{width:24px;height:24px;border-radius:12px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.bb .box-on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

/* motion */
@keyframes bb-in-fwd{from{transform:translateX(100%)}to{transform:none}}
@keyframes bb-in-back{from{transform:translateX(-28%);opacity:.6}to{transform:none;opacity:1}}
@keyframes bb-fade{from{opacity:0}to{opacity:1}}
@keyframes bb-sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes bb-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bb-growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bb-draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@keyframes bb-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bb-shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bb-down{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.bb.nav-fwd{animation:bb-in-fwd .42s cubic-bezier(.32,.72,0,1) both;box-shadow:-12px 0 32px rgba(0,0,0,.12)}
.bb.nav-back{animation:bb-in-back .38s cubic-bezier(.32,.72,0,1) both}
.bb [role="dialog"]{animation:bb-sheet .42s cubic-bezier(.32,.72,0,1) both;will-change:transform}
.bb div[style*="var(--scrim)"],.bb div[style*="rgba(20,20,18,.36)"],.bb div[style*="rgba(20, 20, 18, 0.36)"]{animation:bb-fade .3s ease-out both}
.bb div[style*="inset: 0"][style*="background: var(--bg)"]{animation:bb-sheet .42s cubic-bezier(.32,.72,0,1) both}
.bb span[style*="width: 72px; height: 72px"],.bb span[style*="width: 56px; height: 56px; border-radius: 28px; background: var(--accent-soft)"]{animation:bb-pop .4s cubic-bezier(.2,.8,.2,1) .25s both}
.bb [style*="height: 6px"]>[style*="height: 6px"],.bb [style*="height: 4px"]>[style*="height: 4px"]{transform-origin:left center;animation:bb-grow .8s cubic-bezier(.2,.8,.2,1) .3s both;transition:width .45s cubic-bezier(.2,.8,.2,1),background-color .3s}
.bb div[title][style*="border-radius: 6px 6px 0 0"]{transform-origin:bottom;animation:bb-growy .7s cubic-bezier(.2,.8,.2,1) .3s both}
.bb polyline{stroke-dasharray:1400;animation:bb-draw 1.1s cubic-bezier(.4,0,.2,1) .3s both}
.bb button,.bb a{transition:transform .12s ease,background-color .18s ease,color .18s ease,border-color .18s ease,opacity .18s ease}
.bb button:active:not([disabled]),.bb a:active{transform:scale(.97)}
.bb .key:active{transform:scale(.92)}
.bb .knob{transition:left .22s cubic-bezier(.3,.7,.3,1)}
.bb .switch{transition:background-color .22s}
.bb span[style*="width: 27px; height: 27px"]{transition:left .22s cubic-bezier(.3,.7,.3,1)}
.bb span[style*="width: 51px; height: 31px"]{transition:background-color .22s}
.bb .pw-err{animation:bb-shake .4s ease}
.bb [role="alert"]:not(:empty),.bb [role="status"]{animation:bb-fade .3s ease-out both}
.bb .wrap{animation:bb-down .22s ease-out both}
@media (prefers-reduced-motion: reduce){.bb,.bb *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="bb {{themeClass}}" onClickCapture="{{navCapture}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column">

<div style="padding: 48px 16px 10px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 22px; background: var(--surface); display: flex; align-items: center; justify-content: center; flex: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Accounts</h1>
<button onClick="{{toggleReveal}}" aria-label="{{eyeLabel}}" aria-pressed="{{revealed}}" style="width: 44px; height: 44px; border-radius: 22px; background: var(--surface); display: flex; align-items: center; justify-content: center">
<sc-if value="{{revealed}}" hint-placeholder-val="{{ true }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</sc-if>
<sc-if value="{{hidden}}" hint-placeholder-val="{{ false }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2"></path><path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.5"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
</sc-if>
</button>
<a href="NewAccount.dc.html" aria-label="New account" style="width: 44px; height: 44px; border-radius: 22px; background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
</a>
</div>
<div role="tablist" aria-label="Owner" style="display: flex; gap: 2px; padding: 3px; border-radius: 13px; background: var(--soft)">
<sc-for list="{{owners}}" as="o" hint-placeholder-count="4">
<button role="tab" aria-selected="{{o.on}}" class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button>
</sc-for>
</div>
<div class="hrow" aria-label="Filters">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}<sc-if value="{{c.caret}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></sc-if></button>
</sc-for>
</div>
</div>

<div class="scroll" style="flex: 1; overflow-y: auto; padding: 4px 16px 28px; display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; padding: 0 4px">
<h2 style="margin: 0; font-size: 13px; font-weight: 500; color: var(--muted)">{{g.title}}</h2>
<span style="font-size: 13px; color: var(--muted)">{{g.count}}</span>
</div>
<div style="display: flex; flex-direction: column; border-radius: 18px; background: var(--surface); padding: 0 14px">
<sc-for list="{{g.items}}" as="a" hint-placeholder-count="4">
<a href="AccountDetail.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; text-decoration: none; border-bottom: {{a.border}}; opacity: {{a.opacity}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.name}}</span>
<span class="num" style="font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.meta}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<span class="num" style="font-weight: 500; color: {{a.color}}">{{a.balance}}</span>
<sc-if value="{{a.tag}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: {{a.tagBg}}; color: {{a.tagFg}}">{{a.tag}}</span>
</sc-if>
</span>
</a>
</sc-for>
</div>
</section>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 24px 4px; color: var(--muted)">No accounts match these filters.</p>
</sc-if>
<p style="margin: 0 4px; font-size: 13px; color: var(--muted)">Stale means the balance is older than the monthly check-in.</p>
</div>

<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
<div onClick="{{closeSheet}}" style="position: absolute; inset: 0; background: var(--scrim)"></div>
<div role="dialog" aria-label="{{sheetTitle}}" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 16px 30px; display: flex; flex-direction: column; gap: 6px">
<div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--line)"></div>
<div style="display: flex; align-items: center; gap: 12px; padding-bottom: 4px">
<h2 style="flex: 1; margin: 0; font-size: 18px; font-weight: 600">{{sheetTitle}}</h2>
<button onClick="{{closeSheet}}" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: var(--bg); display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
<sc-for list="{{options}}" as="o" hint-placeholder-count="5">
<button class="opt" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}">
<span class="{{o.boxCls}}"><sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>
<span style="flex: 1; font-weight: 500">{{o.label}}</span>
<span class="num" style="font-size: 13px; color: var(--muted)">{{o.count}}</span>
</button>
</sc-for>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { owner: 'all', type: 'all', cur: 'all', inactive: false, sheet: null, revealed: true };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var SYM = { EUR: '€', USD: '$', RUB: '₽', BTC: '₿' };
    function money(v, cur) {
      var dec = cur === 'BTC' ? 8 : 2;
      return (v < 0 ? '−' : '') + SYM[cur] + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }
    function A(owner, name, type, cur, bal, date, src, extra) { return Object.assign({ owner: owner, name: name, type: type, cur: cur, bal: bal, date: date, src: src }, extra || {}); }
    var ACC = [
      A('Alena', 'ING Girokonto', 'Bank', 'EUR', 1986.3, '05/10/2026', 'Check-in'),
      A('Alena', 'ING Extra-Konto', 'Bank', 'EUR', 12400, '05/10/2026', 'Check-in'),
      A('Alena', 'Revolut', 'Bank', 'EUR', 386.2, '02/09/2026', 'Check-in', { stale: true }),
      A('Alena', 'Revolut', 'Bank', 'USD', 1150, '05/10/2026', 'Check-in'),
      A('Alena', 'Wise', 'Bank', 'USD', 3045.18, '02/09/2026', 'Check-in', { stale: true }),
      A('Alena', 'Trade Republic', 'Investment', 'EUR', 29480.1, '05/10/2026', 'Check-in'),
      A('Alena', 'Cash', 'Cash', 'EUR', 240, '05/10/2026', 'Check-in'),
      A('Alena', 'Cash', 'Cash', 'USD', 300, '05/10/2026', 'Check-in'),
      A('Alena', 'T-Bank', 'Bank', 'RUB', 84500, '02/09/2026', 'Check-in', { stale: true }),
      A('Alena', 'Tinkoff Black', 'Bank', 'RUB', 0, '11/03/2026', 'By hand', { inactive: true }),
      A('Max', 'ING Girokonto', 'Bank', 'EUR', 3880.1, '04/10/2026', 'Check-in'),
      A('Max', 'DKB', 'Bank', 'EUR', 9400, '04/10/2026', 'Check-in'),
      A('Max', 'Revolut', 'Bank', 'EUR', 512.4, '04/10/2026', 'Check-in'),
      A('Max', 'Wise', 'Bank', 'EUR', 1000, '04/10/2026', 'Check-in'),
      A('Max', 'Cash', 'Cash', 'EUR', 90, '04/10/2026', 'Check-in'),
      A('Max', 'Bitcoin', 'Crypto', 'BTC', 0.0412, '04/10/2026', 'Check-in'),
      A('Max', 'Loan to a friend', 'Owed to us', 'EUR', 500, '20/09/2026', 'By hand'),
      A('Sofia', 'N26', 'Bank', 'EUR', 1420, '02/09/2026', 'Check-in', { stale: true }),
      A('Sofia', 'Revolut', 'Bank', 'EUR', 230.15, '02/09/2026', 'Check-in', { stale: true }),
      A('Sofia', 'Cash', 'Cash', 'EUR', 80, '02/09/2026', 'Check-in', { stale: true }),
      A('Sofia', 'T-Bank', 'Bank', 'RUB', 12000, '02/09/2026', 'Check-in', { stale: true }),
      A('Sofia', 'Car loan', 'We owe', 'EUR', -6400, '02/09/2026', 'Check-in', { stale: true }),
      A('Sofia', 'Sparkasse', 'Bank', 'EUR', 0, '30/04/2026', 'By hand', { inactive: true })
    ];
    function passes(a, skip) {
      if (!st.inactive && a.inactive) return false;
      if (skip !== 'owner' && st.owner !== 'all' && a.owner !== st.owner) return false;
      if (skip !== 'type' && st.type !== 'all' && a.type !== st.type) return false;
      if (skip !== 'cur' && st.cur !== 'all' && a.cur !== st.cur) return false;
      return true;
    }
    var list = ACC.filter(function (a) { return passes(a); });
    var rev = st.revealed;
    var groups = ['Alena', 'Max', 'Sofia'].map(function (o) {
      var items = list.filter(function (a) { return a.owner === o; });
      return {
        title: o === 'Alena' ? 'Yours' : o + '’s',
        count: items.length + (items.length === 1 ? ' account' : ' accounts'),
        items: items.map(function (a, i) {
          var tag = '', bg = '', fg = '';
          if (a.inactive) { tag = 'Inactive'; bg = 'var(--soft)'; fg = 'var(--muted)'; }
          else if (a.stale) { tag = 'Stale'; bg = 'var(--warn-soft)'; fg = 'var(--warn)'; }
          return {
            name: a.name + ' · ' + a.cur,
            meta: (a.type === 'Bank' ? '' : a.type + ' · ') + a.src + ' ' + a.date,
            balance: rev ? money(a.bal, a.cur) : SYM[a.cur] + ' • • • •',
            color: a.bal < 0 && rev ? 'var(--warn)' : 'var(--ink)',
            tag: tag, tagBg: bg, tagFg: fg,
            opacity: a.inactive ? '0.6' : '1',
            border: i < items.length - 1 ? '1px solid var(--line)' : '0'
          };
        })
      };
    }).filter(function (g) { return g.items.length; });

    var owners = [['all', 'Everyone'], ['Alena', 'You'], ['Max', 'Max'], ['Sofia', 'Sofia']].map(function (o) {
      var on = st.owner === o[0];
      return { label: o[1], on: on, cls: on ? 'seg seg-on' : 'seg', pick: function () { self.setState({ owner: o[0] }); } };
    });
    var TYPES = [['all', 'All types'], ['Bank', 'Bank'], ['Cash', 'Cash'], ['Investment', 'Investment'], ['Crypto', 'Crypto'], ['We owe', 'Money we owe'], ['Owed to us', 'Money owed to us']];
    var CURS = [['all', 'All currencies'], ['EUR', 'EUR'], ['USD', 'USD'], ['RUB', 'RUB'], ['BTC', 'BTC']];
    function labelOf(arr, v) { return arr.filter(function (x) { return x[0] === v; })[0][1]; }
    var chips = [
      { label: st.type === 'all' ? 'Type' : labelOf(TYPES, st.type), on: st.type !== 'all', caret: true, key: 'type' },
      { label: st.cur === 'all' ? 'Currency' : st.cur, on: st.cur !== 'all', caret: true, key: 'cur' },
      { label: 'Show inactive', on: st.inactive, caret: false, key: 'inactive' }
    ].map(function (c) {
      return { label: c.label, on: c.on, caret: c.caret, cls: c.on ? 'fchip fchip-on' : 'fchip', pick: function () {
        if (c.key === 'inactive') self.setState({ inactive: !self.state.inactive });
        else self.setState({ sheet: c.key });
      } };
    });
    var options = [];
    if (st.sheet) {
      var src = st.sheet === 'type' ? TYPES : CURS;
      options = src.map(function (o) {
        var on = st[st.sheet] === o[0];
        var n = ACC.filter(function (a) { return passes(a, st.sheet) && (o[0] === 'all' || a[st.sheet === 'type' ? 'type' : 'cur'] === o[0]); }).length;
        var patch = {}; patch[st.sheet] = o[0]; patch.sheet = null;
        return { label: o[1], on: on, count: String(n), boxCls: on ? 'box box-on' : 'box', pick: function () { self.setState(patch); } };
      });
    }
    return {
      themeClass: (this.props.dark ? 'bb-dark' : 'bb-light') + ' ' + (function () { try { return sessionStorage.getItem('bb-nav') === 'back' ? 'nav-back' : 'nav-fwd'; } catch (e) { return 'nav-fwd'; } })(),
      navCapture: function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a) return;
        var href = a.getAttribute('href') || '', label = (a.getAttribute('aria-label') || '') + ' ' + (a.textContent || '');
        var back = href === 'Main.dc.html' || /^\s*(Back|Close|Cancel|Done|Later|Keep)/.test(label) || /^\s*(Back home|Back to)/.test(a.textContent || '');
        try { sessionStorage.setItem('bb-nav', back ? 'back' : 'fwd'); if (!back) sessionStorage.setItem('bb-from:' + href, 'Accounts.dc.html'); } catch (err) {}
      },
      revealed: rev, hidden: !rev,
      eyeLabel: rev ? 'Hide balances' : 'Show balances',
      toggleReveal: function () { self.setState({ revealed: !self.state.revealed }); },
      owners: owners, chips: chips, groups: groups, empty: list.length === 0,
      sheetOpen: !!st.sheet,
      sheetTitle: st.sheet === 'type' ? 'Account type' : 'Currency',
      options: options,
      closeSheet: function () { self.setState({ sheet: null }); }
    };
  }
}
</script>
</body>
</html>
