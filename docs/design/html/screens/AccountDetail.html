body{margin:0}
a{color:inherit}a:hover{color:inherit}
.bb-light{--bg:#F4F3EF;--surface:#FFFFFF;--ink:#15171A;--on-ink:#F4F3EF;--muted:#5C6168;--line:#E2E0D9;--soft:#EAE8E2;--accent:#1D5C45;--accent-soft:#DCEAE3;--warn:#A2470F;--warn-soft:#F5E2D4;--scrim:rgba(20,20,18,.36)}

.bb .key{height:46px;border-radius:12px;background:var(--bg);font-size:21px;font-weight:500;display:flex;align-items:center;justify-content:center}
.bb .key-op{background:var(--soft);font-size:19px}
.bb .field{width:100%;min-height:54px;display:flex;align-items:center;gap:12px;text-align:left;border-bottom:1px solid var(--line)}
.bb .field-l{flex:none;width:96px;font-size:14px;color:var(--muted)}
.bb .field-v{flex:1;min-width:0;font-weight:500;text-align:right}
.bb .pill{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center}
.bb .pill-on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* motion */
@keyframes bb-in-fwd{from{transform:translateX(100%)}to{transform:none}}
@keyframes bb-in-back{from{transform:translateX(-28%);opacity:.6}to{transform:none;opacity:1}}
@keyframes bb-fade{from{opacity:0}to{opacity:1}}
@keyframes bb-sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes bb-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bb-growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bb-draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@keyframes bb-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bb-shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bb-down{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}


.bb [role="dialog"]{animation:bb-sheet .42s cubic-bezier(.32,.72,0,1) both;will-change:transform}
.bb div[style*="var(--scrim)"],.bb div[style*="rgba(20,20,18,.36)"],.bb div[style*="rgba(20, 20, 18, 0.36)"]{animation:bb-fade .3s ease-out both}
.bb div[style*="inset: 0"][style*="background: var(--bg)"]{animation:bb-sheet .42s cubic-bezier(.32,.72,0,1) both}
.bb span[style*="width: 72px; height: 72px"],.bb span[style*="width: 56px; height: 56px; border-radius: 28px; background: var(--accent-soft)"]{animation:bb-pop .4s cubic-bezier(.2,.8,.2,1) .25s both}
.bb [style*="height: 6px"]>[style*="height: 6px"],.bb [style*="height: 4px"]>[style*="height: 4px"]{transform-origin:left center;animation:bb-grow .8s cubic-bezier(.2,.8,.2,1) .3s both;transition:width .45s cubic-bezier(.2,.8,.2,1),background-color .3s}
.bb div[title][style*="border-radius: 6px 6px 0 0"]{transform-origin:bottom;animation:bb-growy .7s cubic-bezier(.2,.8,.2,1) .3s both}
.bb polyline{stroke-dasharray:1400;animation:bb-draw 1.1s cubic-bezier(.4,0,.2,1) .3s both}
.bb button,.bb a{transition:transform .12s ease,background-color .18s ease,color .18s ease,border-color .18s ease,opacity .18s ease}
.bb button:active:not([disabled]),.bb a:active{transform:scale(.97)}
.bb .key:active{transform:scale(.92)}
.bb .knob{transition:left .22s cubic-bezier(.3,.7,.3,1)}
.bb .switch{transition:background-color .22s}
.bb span[style*="width: 27px; height: 27px"]{transition:left .22s cubic-bezier(.3,.7,.3,1)}
.bb span[style*="width: 51px; height: 31px"]{transition:background-color .22s}
.bb .pw-err{animation:bb-shake .4s ease}
.bb [role="alert"]:not(:empty),.bb [role="status"]{animation:bb-fade .3s ease-out both}
.bb .wrap{animation:bb-down .22s ease-out both}
@media (prefers-reduced-motion: reduce){.bb,.bb *{animation:none!important;transition:none!important}}
</style>
