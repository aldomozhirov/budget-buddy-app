<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Buddy — Transaction</title>
<!-- Static export of the prototype screen "Transaction" (prototype file TransactionDetail.dc.html), default state.
     Generated on 2026-10-06. Layout and copy are the reference; see docs/design/html/README.md. -->
<link rel="stylesheet" href="../fonts/geist.css">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.bb-light{--bg:#F4F3EF;--surface:#FFFFFF;--ink:#15171A;--on-ink:#F4F3EF;--muted:#5C6168;--line:#E2E0D9;--soft:#EAE8E2;--accent:#1D5C45;--accent-soft:#DCEAE3;--warn:#A2470F;--warn-soft:#F5E2D4;--scrim:rgba(20,20,18,.36)}
.bb-dark{--bg:#111214;--surface:#1A1C1F;--ink:#F1F0EC;--on-ink:#111214;--muted:#A3A8AF;--line:#2B2E33;--soft:#24272B;--accent:#7CC6A3;--accent-soft:#1D3229;--warn:#F2A574;--warn-soft:#3A2618;--scrim:rgba(0,0,0,.55)}
.bb button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.bb .num{font-variant-numeric:tabular-nums}
.bb svg{flex:none}
.bb .scroll::-webkit-scrollbar{display:none}
.bb .field{width:100%;min-height:54px;display:flex;align-items:center;gap:12px;text-align:left;border-bottom:1px solid var(--line)}
.bb .field-l{flex:none;width:96px;font-size:14px;color:var(--muted)}
.bb .field-v{flex:1;min-width:0;font-weight:500;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb .field-link::after{transform:rotate(-45deg);margin-bottom:0}
.bb .field::after{content:"";flex:none;width:7px;height:7px;margin:0 4px 3px 2px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s ease}
.bb .field[aria-expanded="true"]::after{transform:rotate(-135deg);margin-bottom:-3px}
.bb .field:active{background:var(--soft)}
.bb .wrap{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 14px;border-bottom:1px solid var(--line)}
.bb .chip{height:40px;padding:0 14px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:500;display:flex;align-items:center;white-space:nowrap}
.bb .chip-on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.bb .minput{width:100%;box-sizing:border-box;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 12px;outline:none}
.bb .minput:focus{border-color:var(--ink)}
.bb .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* motion */
@keyframes bb-in-fwd{from{transform:translateX(100%)}to{transform:none}}
@keyframes bb-in-back{from{transform:translateX(-28%);opacity:.6}to{transform:none;opacity:1}}
@keyframes bb-fade{from{opacity:0}to{opacity:1}}
@keyframes bb-sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes bb-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bb-growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bb-draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@keyframes bb-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bb-shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bb-down{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}


.bb [role="dialog"]{animation:bb-sheet .42s cubic-bezier(.32,.72,0,1) both;will-change:transform}
.bb div[style*="var(--scrim)"],.bb div[style*="rgba(20,20,18,.36)"],.bb div[style*="rgba(20, 20, 18, 0.36)"]{animation:bb-fade .3s ease-out both}
.bb div[style*="inset: 0"][style*="background: var(--bg)"]{animation:bb-sheet .42s cubic-bezier(.32,.72,0,1) both}
.bb span[style*="width: 72px; height: 72px"],.bb span[style*="width: 56px; height: 56px; border-radius: 28px; background: var(--accent-soft)"]{animation:bb-pop .4s cubic-bezier(.2,.8,.2,1) .25s both}
.bb [style*="height: 6px"]>[style*="height: 6px"],.bb [style*="height: 4px"]>[style*="height: 4px"]{transform-origin:left center;animation:bb-grow .8s cubic-bezier(.2,.8,.2,1) .3s both;transition:width .45s cubic-bezier(.2,.8,.2,1),background-color .3s}
.bb div[title][style*="border-radius: 6px 6px 0 0"]{transform-origin:bottom;animation:bb-growy .7s cubic-bezier(.2,.8,.2,1) .3s both}
.bb polyline{stroke-dasharray:1400;animation:bb-draw 1.1s cubic-bezier(.4,0,.2,1) .3s both}
.bb button,.bb a{transition:transform .12s ease,background-color .18s ease,color .18s ease,border-color .18s ease,opacity .18s ease}
.bb button:active:not([disabled]),.bb a:active{transform:scale(.97)}
.bb .key:active{transform:scale(.92)}
.bb .knob{transition:left .22s cubic-bezier(.3,.7,.3,1)}
.bb .switch{transition:background-color .22s}
.bb span[style*="width: 27px; height: 27px"]{transition:left .22s cubic-bezier(.3,.7,.3,1)}
.bb span[style*="width: 51px; height: 31px"]{transition:background-color .22s}
.bb .pw-err{animation:bb-shake .4s ease}
.bb [role="alert"]:not(:empty),.bb [role="status"]{animation:bb-fade .3s ease-out both}
.bb .wrap{animation:bb-down .22s ease-out both}
@media (prefers-reduced-motion: reduce){.bb,.bb *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bb bb-light" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column">

<div style="padding: 48px 16px 8px; display: flex; align-items: center; gap: 12px">
<a href="Transactions.dc.html" aria-label="Back to transactions" style="width: 44px; height: 44px; border-radius: 22px; background: var(--surface); display: flex; align-items: center; justify-content: center; flex: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>

<span style="font-size: 13px; color: var(--muted)">Today, 5 October 2026 · paid by Alena</span>

<div style="display: flex; flex-direction: column; border-radius: 18px; background: var(--surface); padding: 0 16px">
<button class="field" aria-expanded="false"><span class="field-l">Category</span><span class="field-v">Groceries</span></button>

<button class="field" aria-expanded="false"><span class="field-l">Paid by</span><span class="field-v">Alena</span></button>

<button class="field" aria-expanded="false"><span class="field-l">Merchant</span><span class="field-v">REWE</span></button>

<button class="field" style="border-bottom: 0"><span class="field-l">Note</span><span class="field-v" style="color: var(--muted); font-weight: 400">Add a note</span></button>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 4px; font-size: 13px; font-weight: 500; color: var(--muted)">Record</h2>
<div style="display: flex; flex-direction: column; border-radius: 18px; background: var(--surface); padding: 4px 16px">
<div style="display: flex; gap: 12px; align-items: center; min-height: 48px; border-bottom: 1px solid var(--line)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
<span style="flex: 1; font-size: 14px">Typed in by Alena</span>
<span class="num" style="font-size: 13px; color: var(--muted)">12:04</span>
</div>

<div style="display: flex; gap: 12px; align-items: center; min-height: 48px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10"></path><path d="M17 17v6M14 20h6"></path></svg>
<span style="flex: 1; font-size: 14px; color: var(--muted)">Attach receipt</span>
</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 52px; border-radius: 16px; background: var(--surface); font-weight: 600; text-align: center">Split</button>
<button style="height: 52px; border-radius: 16px; background: var(--surface); color: var(--warn); font-weight: 600; text-align: center">Delete</button>
</div>
</div>



</div>
</body>
