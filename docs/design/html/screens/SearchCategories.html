<link rel="stylesheet" href="../fonts/geist.css">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.bb-light{--bg:#F4F3EF;--surface:#FFFFFF;--ink:#15171A;--on-ink:#F4F3EF;--muted:#5C6168;--line:#E2E0D9;--soft:#EAE8E2;--accent:#1D5C45;--accent-soft:#DCEAE3;--warn:#A2470F;--warn-soft:#F5E2D4;--scrim:rgba(20,20,18,.36)}

.bb button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.bb .num{font-variant-numeric:tabular-nums}

.bb .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}

.bb .meta-set{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.bb .meta-l{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em}

/* motion */
@keyframes bb-in-fwd{from{transform:translateX(100%)}to{transform:none}}
@keyframes bb-in-back{from{transform:translateX(-28%);opacity:.6}to{transform:none;opacity:1}}
@keyframes bb-fade{from{opacity:0}to{opacity:1}}
@keyframes bb-sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes bb-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bb-growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bb-draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@keyframes bb-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bb-shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bb-down{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.bb div[title][style*="border-radius: 6px 6px 0 0"]{transform-origin:bottom;animation:bb-growy .7s cubic-bezier(.2,.8,.2,1) .3s both}
.bb polyline{stroke-dasharray:1400;animation:bb-draw 1.1s cubic-bezier(.4,0,.2,1) .3s both}
.bb button,.bb a{transition:transform .12s ease,background-color .18s ease,color .18s ease,border-color .18s ease,opacity .18s ease}
.bb button:active:not([disabled]),.bb a:active{transform:scale(.97)}

@media (prefers-reduced-motion: reduce){.bb,.bb *{animation:none!important;transition:none!important}}
